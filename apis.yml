apis:
  - name: Open Poker REST API
    description: >-
      REST API covering profile (/me), season data (/season/current, /season/list, /season/leaderboard, /season/me),
      rebuys, Pro purchases, payments, Pro bot control, Portfolio API, and public competition spectator endpoints.
      Public season/leaderboard endpoints require no auth.
