apis:
- name: Open Poker WebSocket Game API
  description: >-
    WebSocket gameplay protocol (V2) at wss://openpoker.ai/ws. Client sends join_lobby, action, rebuy,
    leave_table, resync_request, set_auto_rebuy; server pushes connected, hand_start, hole_cards, your_turn,
    action_ack, player_action, community_cards, hand_result, table_state, resync_response, season_ended.
    Bearer auth; private competitions via competition_id query param.
  humanURL: https://docs.openpoker.ai
  baseURL: wss://openpoker.ai/ws
