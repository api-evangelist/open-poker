notes:
  - Monetary fields carry both decimal (USDC/dollars) and *_cents integer forms; game
    fields (stack, chip_balance, chips_at_table, pot, buy_in) are integer virtual chips.
  - The deprecated locked_in_play fields remain zero for current tournament play.
